version: 2

models:
  - name: stg_satcat_latest
    description: The newest catalogue row for every object (incremental, one row per object).
    columns:
      - name: norad_cat_id
        data_tests: [unique, not_null]
      - name: object_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['PAY', 'R/B', 'DEB', 'UNK']

  - name: stg_satcat_changes
    description: >
      Tracked catalogue attributes, stored only when they change (first appearance, then
      one row per change). Completed UTC days only; incremental, append.
    data_tests:
      - unique_combination:
          arguments:
            columns: [norad_cat_id, snapshot_date]
