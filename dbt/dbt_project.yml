name: orbitwatch
version: "0.1.0"
config-version: 2
profile: orbitwatch

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Thresholds for manoeuvre detection; see models/marts/fct_orbit_changes.sql
  raise_km: 0.5
  lower_km: 2.0
  max_gap_days: 3
  plane_change_deg: 0.02

models:
  orbitwatch:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
