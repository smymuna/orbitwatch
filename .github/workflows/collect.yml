name: Collect

# CelesTrak only serves the current state of orbit, so history exists only if we keep it.
# Every 6 hours: restore earlier snapshots from GitHub Releases, take a new one, rebuild the
# warehouse, and publish the day's data as a release (the project's growing archive).
# Same-day runs add their snapshots to that day's release. The Site workflow then rebuilds
# the website from it.
on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours at :17, off the hour to spread load on CelesTrak
  workflow_dispatch:
    inputs:
      full_refresh:
        description: Rebuild the warehouse from every snapshot (after changing a model)
        type: boolean
        default: false

permissions:
  contents: write # to publish data releases

concurrency:
  group: collect
  cancel-in-progress: false

env:
  ORBITWATCH_DATA_DIR: data
  DAGSTER_HOME: ${{ github.workspace }}/.dagster_home
  GH_TOKEN: ${{ github.token }}
  FULL_REFRESH_REQUESTED: ${{ inputs.full_refresh && '1' || '0' }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      # Incremental (ADR 0004): continue from the newest published warehouse and restore only
      # the snapshots from that day on. With no usable warehouse (first run, a model change,
      # or full_refresh), rebuild from every snapshot ever published.
      - name: Restore the warehouse and recent snapshots
        run: |
          mkdir -p data "$DAGSTER_HOME"
          tags=$(gh release list --limit 1000 --json tagName --jq '[.[].tagName | select(startswith("data-"))] | sort | .[]')
          base=""
          if [ "$FULL_REFRESH_REQUESTED" != 1 ]; then
            for tag in $(echo "$tags" | sort -r); do
              if gh release download "$tag" --pattern 'warehouse-*.duckdb' --dir /tmp/warehouse; then
                mv /tmp/warehouse/warehouse-*.duckdb data/warehouse.duckdb
                base=$tag
                break
              fi
            done
          fi
          # A warehouse from before the incremental models can't be continued.
          if [ -n "$base" ] && ! python -c "import duckdb, sys; c = duckdb.connect('data/warehouse.duckdb', read_only=True); sys.exit(0 if c.sql(\"select count(*) from duckdb_tables() where table_name = 'stg_satcat_changes'\").fetchone()[0] else 1)"; then
            echo "The warehouse in $base predates the incremental models"
            rm data/warehouse.duckdb
            base=""
          fi
          if [ -n "$base" ]; then
            echo "Continuing from the warehouse in $base"
          else
            echo "Rebuilding from every snapshot"
            echo "ORBITWATCH_FULL_REFRESH=1" >> "$GITHUB_ENV"
          fi
          for tag in $tags; do
            if [ -z "$base" ] || [[ ! "$tag" < "$base" ]]; then
              gh release download "$tag" --pattern 'bronze-*.tar.gz' --dir /tmp/restore --clobber
            fi
          done
          for f in /tmp/restore/*.tar.gz; do [ -e "$f" ] && tar -xzf "$f" -C data; done
          find data -name '*.parquet' | wc -l
      - name: Run the pipeline (retries only if CelesTrak is unreachable)
        id: pipeline
        continue-on-error: true # snapshots are still published below; the last step fails the run
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if dagster job execute -m orbitwatch.definitions -j refresh 2>&1 | tee run.log; then
              exit 0
            fi
            if ! grep -qE "CelesTrak unreachable|HTTP 5[0-9]{2}" run.log; then
              echo "::error::Not a connection problem, so retrying would not help"
              exit 1
            fi
            [ "$attempt" = 3 ] && break
            echo "::warning::Attempt $attempt failed; trying again in 10 minutes"
            sleep 600
          done
          exit 1
      # CelesTrak keeps no history, so a snapshot not saved now is lost for good. Publish it
      # even when a later step failed; the warehouse only when the whole pipeline passed.
      - name: Publish today's snapshot
        run: |
          day=$(date -u +%F)
          files=$(cd data && find bronze -path "*snapshot_date=$day*" -name '*.parquet')
          if [ -z "$files" ]; then
            echo "No snapshot from today to publish"
            exit 0
          fi
          tar -czf "bronze-$day.tar.gz" -C data $files
          assets="bronze-$day.tar.gz"
          if [ "${{ steps.pipeline.outcome }}" = success ]; then
            orbitwatch-compact data/warehouse.duckdb "warehouse-$day.duckdb"
            assets="$assets warehouse-$day.duckdb"
          fi
          gh release create "data-$day" $assets \
            --title "Data $day" --notes "Daily snapshot of CelesTrak GP groups and the satellite catalogue (bronze Parquet) plus the rebuilt DuckDB warehouse, added once a run passes." \
            --latest=false || gh release upload "data-$day" $assets --clobber
      - name: Fail the run if the pipeline failed
        if: steps.pipeline.outcome != 'success'
        run: exit 1
