name: Collect

# CelesTrak only serves the current state of orbit, so history exists only if we keep it.
# Once a day: restore earlier snapshots from GitHub Releases, take a new one, rebuild the
# warehouse, and publish today's data as a release (the project's growing archive).
on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily, off the hour to spread load on CelesTrak
  workflow_dispatch:

permissions:
  contents: write # to publish data releases

concurrency:
  group: collect
  cancel-in-progress: false

env:
  ORBITWATCH_DATA_DIR: data
  DAGSTER_HOME: ${{ github.workspace }}/.dagster_home
  GH_TOKEN: ${{ github.token }}
  KEEP_DAYS: 90 # days of history restored for each run

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Restore history (bronze snapshots from earlier data releases)
        run: |
          mkdir -p data "$DAGSTER_HOME"
          for tag in $(gh release list --limit "$KEEP_DAYS" --json tagName --jq '.[].tagName | select(startswith("data-"))'); do
            gh release download "$tag" --pattern 'bronze-*.tar.gz' --dir /tmp/restore --clobber
          done
          for f in /tmp/restore/*.tar.gz; do [ -e "$f" ] && tar -xzf "$f" -C data; done
          find data -name '*.parquet' | wc -l
      - name: Run the pipeline
        run: dagster job execute -m orbitwatch.definitions -j refresh
      - name: Publish today's snapshot
        run: |
          day=$(date -u +%F)
          tar -czf "bronze-$day.tar.gz" -C data $(cd data && find bronze -path "*snapshot_date=$day*" -name '*.parquet')
          cp data/warehouse.duckdb "warehouse-$day.duckdb"
          gh release create "data-$day" "bronze-$day.tar.gz" "warehouse-$day.duckdb" \
            --title "Data $day" --notes "Daily snapshot of CelesTrak GP groups and the satellite catalogue (bronze Parquet) plus the rebuilt DuckDB warehouse." \
            --latest=false || gh release upload "data-$day" "bronze-$day.tar.gz" "warehouse-$day.duckdb" --clobber
