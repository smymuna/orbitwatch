name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy src tests
      - name: Dagster definitions load (asset graph, dbt manifest)
        run: dagster definitions validate -m orbitwatch.definitions
      - name: Test (unit + offline end-to-end pipeline with dbt and DuckDB)
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t orbitwatch:ci .
      - name: Smoke test (UI responds)
        run: |
          docker run -d --name ow -p 3000:3000 orbitwatch:ci
          for i in $(seq 1 60); do curl -fs localhost:3000/server_info && exit 0; sleep 2; done
          docker logs ow; exit 1
